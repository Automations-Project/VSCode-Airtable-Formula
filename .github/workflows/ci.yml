name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # tsup and vite do not typecheck, so a type error ships unless tsc runs here.
      # Gated today: shared, language-services, webview. NOT yet gated: extension and
      # lsp-server, which have pre-existing errors. Add each to the `typecheck` script in
      # package.json as soon as `tsc --noEmit` passes in it.
      - run: pnpm typecheck
      - run: pnpm test
      # Needs the network (fetches the pinned upstream agents.ts), so it is not inside `pnpm test`.
      - run: pnpm check:agent-dirs
      - name: Verify npm tarball contents
        shell: bash
        run: |
          set -euo pipefail
          cd packages/mcp-server
          # Fail the job if `npm pack --dry-run` itself fails (e.g. missing
          # files listed in package.json "files", malformed package.json).
          # `tee` preserves the status of the left-hand command via pipefail.
          npm pack --dry-run 2>&1 | tee pack-output.txt
          if grep -q "dev-tools/" pack-output.txt; then
            echo "ERROR: dev-tools/ in tarball" && exit 1
          fi
          echo "Tarball contents clean"
